<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculatrice moderne</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="telephone">

        <div class="encoche"></div>

        <div class="contenu">

            <h1>CALCULATRICE MODERNE</h1>

            <!-- ÉCRAN -->
            <div class="ecran" id="ecran">0</div>

            <!-- CLAVIER -->
            <div class="clavier">

                <!-- COMMANDES -->
                <button class="orange" data-value="AC">AC</button>

                <button class="mode" id="mode">
                    MODE 0
                </button>

                <button data-value="%">%</button>
                <button data-value="√">√</button>

                <!-- OPÉRATIONS -->
                <button data-value="(">(</button>
                <button data-value=")">)</button>
                <button data-value="^">^</button>
                <button data-value="/">/</button>

                <!-- CHIFFRES -->
                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-value="*">*</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="-">-</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-value="+">+</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button data-value="←">←</button>

                <button class="orange" data-value="=">=</button>

            </div>

        </div>

        <div class="barre"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
